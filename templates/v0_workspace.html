<!DOCTYPE html>
<html>
 <head>
  <title>
   SutraJyotish Workspace
  </title>
  <link href="/static/css/workspace.css" rel="stylesheet"/>
 </head>
 <body>
  <div style="padding:12px 18px;background:#f3f0df;border-bottom:1px solid #999;">
   <button class="landing-btn" onclick="window.location.href='/'">
    ← Back to Landing Page
   </button>
  </div>
  
<div class="workspace-toolbar">
<button class="workspace-tab active-tab" onclick="showWorkspacePanel('chartsPanel', this)">Charts</button>
<button class="workspace-tab" onclick="showWorkspacePanel('sutraPanel', this)">KP Grid</button>
<button class="workspace-tab" onclick="showWorkspacePanel('planetsPanel', this)">Planets</button>
<button class="workspace-tab" onclick="showWorkspacePanel('cuspsPanel', this)">Cusps</button>
<button class="workspace-tab" onclick="showWorkspacePanel('kp249Panel', this)">KP 249</button>
<button class="workspace-tab" onclick="showWorkspacePanel('dasaPanelMain', this)">Dasa</button>
<button class="workspace-tab" onclick="window.location.href='/'">Transit</button>
</div>

<div class="workspace-container">
   <div class="top-section workspace-panel" id="chartsPanel">
    <div class="chart-box">
     <div class="panel-title">
      Lagna Chart
     </div>
     <div id="lagnaChart">
     </div>
    </div>
    <div class="chart-box">
     <div class="panel-title">
      Bhav Chalit
     </div>
     <div id="bhavChart">
     </div>
    </div>
    <div class="right-panel">
     <div class="dasa-panel">
      <div class="dasa-panel">
       <div class="panel-title">
        Vimshottari Dasa
       </div>
       <div id="dasaNavigator">
       </div>
       <div class="dasa-nav-controls">
        <button id="btnDasaBack">
         &lt;&lt;
        </button>
        <button id="btnDasaNext">
         &gt;&gt;
        </button>
       </div>
       <div id="dasaTableContainer">
       </div>
      </div>
      <div class="details-panel">
       <div class="detail-row">
        <span>
         Date of Birth
        </span>
        <span id="dobValue">
        </span>
       </div>
       <div class="detail-row">
        <span>
         Latitude
        </span>
        <span id="latValue">
        </span>
       </div>
       <div class="detail-row">
        <span>
         Longitude
        </span>
        <span id="lonValue">
        </span>
       </div>
       <div class="detail-row">
        <span>
         Sidereal Time
        </span>
        <span id="siderealValue">
        </span>
       </div>
      </div>
      <div class="ruling-panel">
       <div class="panel-title">
        Ruling Planets
       </div>
       <div id="rulingPlanets">
       </div>
      </div>
      <div class="time-tool-panel">
       <div class="panel-title">
        Time Tool
       </div>
       <div class="time-tool-grid">
        <div class="time-row">
         <span>
          1 Day
         </span>
         <button onclick="adjustBirthTime('day',1)">
          +
         </button>
         <button onclick="adjustBirthTime('day',-1)">
          -
         </button>
        </div>
        <div class="time-row">
         <span>
          1 Hour
         </span>
         <button onclick="adjustBirthTime('hour',1)">
          +
         </button>
         <button onclick="adjustBirthTime('hour',-1)">
          -
         </button>
        </div>
        <div class="time-row">
         <span>
          10 Minute
         </span>
         <button onclick="adjustBirthTime('minute10',1)">
          +
         </button>
         <button onclick="adjustBirthTime('minute10',-1)">
          -
         </button>
        </div>
        <div class="time-row">
         <span>
          1 Minute
         </span>
         <button onclick="adjustBirthTime('minute1',1)">
          +
         </button>
         <button onclick="adjustBirthTime('minute1',-1)">
          -
         </button>
        </div>
       </div>
      </div>
     </div>
    </div>
    <div class="grid-section workspace-panel" id="sutraPanel" style="display:none;">
     <div class="panel-title">
      Sutra Grid
     </div>
     
<table class="sutra-grid-horosoft" id="sutraGrid">
    <tbody id="sutraGridBody"></tbody>
</table>

    </div>
   </div>
   
<div class="workspace-panel" id="planetsPanel" style="display:none;">
<div class="panel-title">Planets</div>
<div id="planetsContent"></div>
</div>

<div class="workspace-panel" id="cuspsPanel" style="display:none;">
<div class="panel-title">Cusps</div>
<div id="cuspsContent"></div>
</div>

<div class="workspace-panel" id="kp249Panel" style="display:none;">
<div class="panel-title">KP 249</div>
<div id="kp249Content"></div>
</div>

<div class="workspace-panel" id="dasaPanelMain" style="display:none;">
<div class="panel-title">Dasa Details</div>
<div id="dasaOnlyContent"></div>
</div>

<script src="/static/js/workspace.js?v=1004">
   </script>
  </div>
 </body>
</html>
