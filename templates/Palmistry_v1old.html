<!DOCTYPE html>
<html>
<head>
    <title>PalmSutra PRO</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial;
            background: #0b1c2c;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 95%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: white;
        }

        .header {
            background: #0d2438;
            padding: 10px;
            text-align: center;
            font-size: 22px;
        }

        .topbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            padding: 8px;
        }

        button {
            background: #1e2a38;
            color: white;
            border: 1px solid #3a4a5a;
            padding: 6px 10px;
            cursor: pointer;
        }

        button.active {
            background: #00bcd4;
            color: black;
        }

        canvas {
            width: 100%;
            height: 100%;
            background: black;
            display: block;
        }

        .canvas-wrapper {
            flex: 1;
        }
    </style>
</head>

<body>

<div class="app-container">

<div class="header">

    <div style="
        display:flex;
        justify-content:space-between;
        align-items:center;
        flex-wrap:wrap;
    ">

        <button
            onclick="window.location.href='/'"
            style="
                background:#1e2a38;
                color:white;
                border:1px solid #3a4a5a;
                padding:6px 12px;
                cursor:pointer;
            "
        >
            ← Back to Landing Page
        </button>

        <div style="
            font-size:22px;
            font-weight:bold;
        ">
            PalmSutra PRO
        </div>

        <button
            onclick="window.print()"
            style="
                background:#1e2a38;
                color:white;
                border:1px solid #3a4a5a;
                padding:6px 12px;
                cursor:pointer;
            "
        >
            🖨 Print
        </button>

    </div>

</div>

<div class="topbar">
    <input type="file" onchange="loadPalmImage(event)">

    <button onclick="setMode('life')">Life</button>
    <button onclick="setMode('fate')">Fate</button>
    <button onclick="setMode('head')">Brain</button>
    <button onclick="setMode('heart')">Heart</button>

    <button id="dotBtn" onclick="toggleDotMode()">Dot</button>

    <button id="enhanceBtn" onclick="toggleEnhance()">Enhance Brush</button>

    Strength 
    <input type="range" min="1" max="3" step="0.1" value="1.5"
        onchange="enhanceStrength=this.value">

    <button onclick="enhanceFull()">Enhance Full</button>

    <button onclick="zoomIn()">+</button>
    <button onclick="zoomOut()">−</button>

    <button onclick="undoLast()">Undo</button>
    <button onclick="clearCanvas()">Reset</button>
</div>

<div class="canvas-wrapper">
    <canvas id="canvas"></canvas>
</div>

</div>

<script>
let canvas = document.getElementById("canvas");
let ctx = canvas.getContext("2d");

let img = new Image();
let mode = "";
let dotMode = false;
let enhanceMode = false;

let enhanceStrength = 1.5;

let imgScale = 1, imgX = 0, imgY = 0;

let drawing = false;

// DATA
let lifeLinePoints = [];
let fateLinePoints = [];
let headLinePoints = [];
let heartLinePoints = [];

// ================= RESIZE =================
function resizeCanvas(){
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    redraw();
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// ================= LOAD =================
function loadPalmImage(e){
    let reader = new FileReader();
    reader.onload = function(ev){
        img.onload = function(){
            let scaleX = canvas.width / img.width;
            let scaleY = canvas.height / img.height;
            imgScale = Math.min(scaleX, scaleY);

            imgX = (canvas.width - img.width*imgScale)/2;
            imgY = (canvas.height - img.height*imgScale)/2;

            redraw();
        };
        img.src = ev.target.result;
    };
    reader.readAsDataURL(e.target.files[0]);
}

// ================= MODE =================
function setMode(m){ mode = m; }

function toggleDotMode(){
    dotMode = !dotMode;
    enhanceMode = false;
    dotBtn.classList.toggle("active");
    enhanceBtn.classList.remove("active");
}

function toggleEnhance(){
    enhanceMode = !enhanceMode;
    dotMode = false;
    enhanceBtn.classList.toggle("active");
    dotBtn.classList.remove("active");
}

// ================= CLICK =================
canvas.onclick = function(e){

    if(dotMode){
        let rect = canvas.getBoundingClientRect();

        let p = {
            x:(e.clientX-rect.left-imgX)/imgScale,
            y:(e.clientY-rect.top-imgY)/imgScale
        };

        getArray().push(p);
        redraw();
    }
};

canvas.onmousedown = function(e){
    if(enhanceMode){
        drawing = true;
    }
};

canvas.onmouseup = ()=> drawing=false;

canvas.onmousemove = function(e){

    if(!drawing || !enhanceMode) return;

    let rect = canvas.getBoundingClientRect();

    let x = e.clientX - rect.left;
    let y = e.clientY - rect.top;

    enhanceAt(x,y);
};

// ================= ENHANCE =================
function enhanceAt(x,y){

    let size = 60;

    let imgData = ctx.getImageData(x-size/2, y-size/2, size, size);
    let data = imgData.data;

    for(let i=0;i<data.length;i+=4){

        let r=data[i], g=data[i+1], b=data[i+2];

        let avg=(r+g+b)/3;

        // contrast
        r = avg + (r-avg)*enhanceStrength;
        g = avg + (g-avg)*enhanceStrength;
        b = avg + (b-avg)*enhanceStrength;

        data[i]=r;
        data[i+1]=g;
        data[i+2]=b;
    }

    ctx.putImageData(imgData, x-size/2, y-size/2);
}

// ================= FULL ENHANCE =================
function enhanceFull(){

    let imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
    let d = imgData.data;

    for(let i=0;i<d.length;i+=4){

        let avg=(d[i]+d[i+1]+d[i+2])/3;

        d[i]=avg+(d[i]-avg)*enhanceStrength;
        d[i+1]=avg+(d[i+1]-avg)*enhanceStrength;
        d[i+2]=avg+(d[i+2]-avg)*enhanceStrength;
    }

    ctx.putImageData(imgData,0,0);
}

// ================= DRAW =================
function drawLine(pts,color){
    if(pts.length<2) return;

    ctx.beginPath();
    ctx.strokeStyle=color;

    ctx.moveTo(pts[0].x*imgScale+imgX, pts[0].y*imgScale+imgY);

    for(let i=1;i<pts.length;i++){
        ctx.lineTo(pts[i].x*imgScale+imgX, pts[i].y*imgScale+imgY);
    }

    ctx.stroke();
}

function getArray(){
    if(mode==="life") return lifeLinePoints;
    if(mode==="fate") return fateLinePoints;
    if(mode==="head") return headLinePoints;
    if(mode==="heart") return heartLinePoints;
}

// ================= REDRAW =================
function redraw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.drawImage(img, imgX, imgY, img.width*imgScale, img.height*imgScale);

    drawLine(lifeLinePoints,"green");
    drawLine(fateLinePoints,"cyan");
    drawLine(headLinePoints,"violet");
    drawLine(heartLinePoints,"red");
}

// ================= ZOOM =================
canvas.addEventListener("wheel", function(e){
    e.preventDefault();
    imgScale *= e.deltaY<0 ? 1.1 : 0.9;
    redraw();
});

function zoomIn(){ imgScale*=1.2; redraw(); }
function zoomOut(){ imgScale/=1.2; redraw(); }

// ================= RESET =================
function clearCanvas(){
    lifeLinePoints=[];
    fateLinePoints=[];
    headLinePoints=[];
    heartLinePoints=[];
    redraw();
}

// ================= UNDO =================
function undoLast(){
    let arr=getArray();
    if(arr && arr.length>0) arr.pop();
    redraw();
}
</script>

</body>
</html>
