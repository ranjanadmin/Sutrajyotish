<!DOCTYPE html>
<html>
<head>
<title>KP Horary Workspace</title>
<style>
body{font-family:Arial;margin:0;background:#f5f5f5}
.top{background:#111827;color:white;padding:14px 20px;display:flex;justify-content:space-between}
.container{padding:20px}
button{padding:8px 14px;border-radius:6px;border:1px solid #999;cursor:pointer}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.panel{background:white;padding:20px;border-radius:10px;margin-bottom:20px}
.chart{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;max-width:700px}
.house{border:1px solid #ccc;min-height:90px;padding:8px;background:#fafafa}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
.hidden{display:none}
</style>
</head>
<body>

<div class="top">
<div>🔱 KP Horary Workspace</div>
<div>
<button onclick="window.location.href='/'">Home</button>
<button onclick="window.print()">Print</button>
</div>
</div>

<div class="container">

<div class="toolbar">
<button onclick="show('charts')">Charts</button>
<button onclick="show('planets')">Planets</button>
<button onclick="show('cusps')">Cusps</button>
<button onclick="show('kp')">KP Grid</button>
<button onclick="show('dasa')">Dasa</button>
<button onclick="show('prediction')">Prediction</button>
</div>

<div class="panel">
<label>Revolve From House</label>
<select id="rev">
<option value="1">1</option>
<option value="2">2</option>
<option value="3">3</option>
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
<option value="11">11</option>
<option value="12">12</option>
</select>
<button onclick="revolve()">Revolve</button>
</div>

<div id="charts" class="panel">
<h2>Lagna Chart</h2>
<div id="lagna" class="chart"></div>
<h2>Bhav Chart</h2>
<div id="bhav" class="chart"></div>
</div>

<div id="planets" class="panel hidden"><table id="planetsTable"></table></div>
<div id="cusps" class="panel hidden"><table id="cuspsTable"></table></div>
<div id="kp" class="panel hidden"><table id="kpTable"></table></div>
<div id="dasa" class="panel hidden"><div id="dasaTree"></div></div>
<div id="prediction" class="panel hidden">

<h2>Prediction Engine</h2>

<div id="predictionEnginePanel"
     style="
        background:#fff;
        border:1px solid #ddd;
        border-radius:8px;
        padding:15px;
        min-height:120px;
     ">

Loading prediction...

</div>

</div>

<script>
let workspaceData={};

async function init(){
 const res=await fetch('/horary_workspace_data');
 workspaceData=await res.json();
 render();
}

function show(id){

 ['charts',
  'planets',
  'cusps',
  'kp',
  'dasa',
  'prediction'
 ].forEach(x=>{

   const el = document.getElementById(x);

   if(el){
      el.classList.add('hidden');
   }

 });

 const target = document.getElementById(id);

 if(target){
      target.classList.remove('hidden');
 }

}


function draw(chart,target){
 const el=document.getElementById(target);
 el.innerHTML='';
 for(let i=1;i<=12;i++){

   const d=document.createElement('div');

   d.className='house';

   const items=chart[i]||[];

   d.innerHTML='<b>'+i+'</b><br>'+items.join('<br>');

   el.appendChild(d);
 }
}

function render(){

 draw(workspaceData.lagna_chart_workspace||{},'lagna');

 draw(workspaceData.bhav_chart||{},'bhav');

 let p='<tr><th>Planet</th><th>Sign</th><th>Degree</th><th>Nak</th><th>Sub</th></tr>';

 (workspaceData.natal_table||[]).forEach(x=>{
   p+=`<tr><td>${x.planet}</td><td>${x.sign}</td><td>${x.degree}</td><td>${x.nak}</td><td>${x.sub}</td></tr>`;
 });

 document.getElementById('planetsTable').innerHTML=p;

 let c='<tr><th>House</th><th>Sign</th><th>Degree</th><th>Nak</th><th>Sub</th></tr>';

 (workspaceData.cusps||[]).forEach(x=>{
   c+=`<tr><td>${x.house}</td><td>${x.sign}</td><td>${x.degree}</td><td>${x.nak}</td><td>${x.sub}</td></tr>`;
 });

 document.getElementById('cuspsTable').innerHTML=c;

 let k='<tr><th>Planet</th><th>Planet Houses</th><th>Star Lord</th><th>Star Houses</th><th>Sub Lord</th><th>Sub Houses</th></tr>';

 (workspaceData.kp_grid||[]).forEach(x=>{
   k+=`<tr><td>${x.planet}</td><td>${x.planet_houses}</td><td>${x.star_lord}</td><td>${x.star_houses}</td><td>${x.sub_lord}</td><td>${x.sub_houses}</td></tr>`;
 });

 document.getElementById('kpTable').innerHTML=k;

 let d='';

 (workspaceData.dasa_tree||[]).forEach(m=>{

   let bhuktiHtml='';

   (m.bhukti || []).forEach(b=>{

      let antaraHtml='';

      (b.antar || []).forEach(a=>{

          antaraHtml += `
          <details style="margin-left:40px;margin-top:6px;">
             <summary>
                ${a.lord} Antara
                (${a.start} → ${a.end})
             </summary>
          </details>
          `;
      });

      bhuktiHtml += `
      <details style="margin-left:20px;margin-top:8px;">

          <summary>
             <b>${b.lord} Bhukti</b>
             (${b.start} → ${b.end})
          </summary>

          ${antaraHtml}

      </details>
      `;
   });

   d += `
   <details style="margin-bottom:12px;">

      <summary>
         <b>${m.lord} Mahadasa</b>
         (${m.start} → ${m.end})
      </summary>

      ${bhuktiHtml}

   </details>
   `;
 });

 document.getElementById('dasaTree').innerHTML=d;
 renderPredictionEngine();
}

async function renderPredictionEngine(){

 try{

   const response =
      await fetch(
         "/api/prediction/career",
         {
            method:"POST",

            headers:{
               "Content-Type":
                  "application/json"
            },

            body:JSON.stringify({

               kp_grid:
                  workspaceData.kp_grid || [],

               current_dasa:
                  workspaceData.current_dasa || {}

            })
         }
      );

   const result =
      await response.json();

   console.log(
      "Prediction Result",
      result
   );

   const panel =
      document.getElementById(
         "predictionEnginePanel"
      );

   if(!panel){
      return;
   }

   panel.innerHTML = `

<h3>Career Analysis</h3>

<h3>Astrological Interpretation</h3>

<ul>
${
(result.prediction_summary || [])
.map(x => `<li>${x}</li>`)
.join("")
}
</ul>

<p>
<b>Career Score:</b>
${result.career_score || 0}
</p>

<p>
<b>Severity:</b>
${result.severity || ""}
</p>

<p>
<b>Career Mode:</b>
${result.career_mode || ""}
</p>

<p>
<b>Positive Factors:</b>
${result.positive_hits || 0}
</p>

<p>
<b>Negative Factors:</b>
${result.negative_hits || 0}
</p>
<p>
<b>Status:</b>
${result.status || ""}
</p>

<p>
<b>Income:</b>
${result.income || ""}
</p>

<p>
<b>Most Likely Manifestation Window:</b>
${result.best_window || "Under Analysis"}
</p>

<hr>

<hr>

<h3>24 Month Outlook</h3>

<p>
<b>Best Window:</b>
${result.best_window || "Under Analysis"}
</p>


<h3>Consultation</h3>

<p>
For detailed interpretation,
career planning,
business decisions,
marriage,
health,
property matters,
and remedial guidance,
consult through
www.sutrajyotish.com
</p>

`;

 }catch(err){

   console.error(err);

   document.getElementById(
      "predictionEnginePanel"
   ).innerHTML =
      "<b>Prediction Engine Error</b>";
 }
show("prediction");
}

function revolve(){
 const from=parseInt(document.getElementById('rev').value);

 function rotate(chart){
   const rotated={};

   for(let house=1;house<=12;house++){

      let src=house+from-1;

      if(src>12){src-=12;}

      rotated[house]=chart[src]||[];
   }

   return rotated;
 }

 draw(rotate(workspaceData.lagna_chart_workspace||{}),'lagna');

 draw(rotate(workspaceData.bhav_chart||{}),'bhav');
}

init();
</script>

</body>
</html>
